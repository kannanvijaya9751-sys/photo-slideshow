<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Photo Slideshow</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    .slideshow {
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: black;
    }

    .slideshow img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }

    .slideshow img.active {
      display: block;
    }
  </style>
</head>

<body>

  <div class="slideshow">

    <!-- Add your photos here -->
    <img src="photo1.jpg" class="active">
    <img src="photo2.jpg">
    <img src="photo3.jpg">
    <img src="photo4.jpg">
    <img src="photo5.jpg">
    <img src="photo6.jpg">
    <img src="photo7.jpg">
    <img src="photo8.jpg">
    <img src="photo9.jpg">
    <img src="photo10.jpg">

  </div>

  <script>
    const photos = document.querySelectorAll(".slideshow img");

    let current = 0;

    function changePhoto() {
      photos[current].classList.remove("active");

      current++;

      if (current >= photos.length) {
        current = 0;
      }

      photos[current].classList.add("active");
    }

    // Change photo every 2 seconds
    setInterval(changePhoto, 2000);
  </script>

</body>
</html>
